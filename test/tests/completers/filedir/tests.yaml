args: ["--input-type=yaml"]
definition_file: "definition.yaml"
---
number: 1
description: "Check --directory"
send: "crazy-complete-test --directory "
bash_expected: |
  > crazy-complete-test --directory
  bin        directory
  > crazy-complete-test --directory
fish_expected: |
  > crazy-complete-test --directory
  bin/  directory/
zsh_expected: |
  > crazy-complete-test --directory
  bin/        directory/
---
number: 2
description: "Check --file"
send: "crazy-complete-test --file "
bash_expected: |
  > crazy-complete-test --file
  README.md         file with spaces  file4.txt.1       source.c++
  archive.tar.gz    file0.txt         image0.jpg
  bin               file1.TXT         image1.JPG
  directory         file3.tXt         image2.jPg
  > crazy-complete-test --file
fish_expected: |
  > crazy-complete-test --file
  archive.tar.gz  file with spaces  file3.tXt    image1.JPG  source.c++
  bin/            file0.txt         file4.txt.1  image2.jPg
  directory/      file1.TXT         image0.jpg   README.md
zsh_expected: |
  > crazy-complete-test --file
  README.md           file\ with\ spaces  file4.txt.1         source.c++
  archive.tar.gz      file0.txt           image0.jpg
  bin/                file1.TXT           image1.JPG
  directory/          file3.tXt           image2.jPg
