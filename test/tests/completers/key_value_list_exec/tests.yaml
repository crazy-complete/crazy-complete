number: 9
description: "key_value_list_exec: Check -o repeatable,"
send: "crazy-complete-test -o repeatable,"
bash_expected: |
  > crazy-complete-test -o repeatable,
  repeatable,animal      repeatable,exclusive   repeatable,repeatable
  repeatable,async       repeatable,optional    repeatable,special
  > crazy-complete-test -o repeatable,
fish_expected: |
  > crazy-complete-test -o repeatable,
  …peatable,animal=        (select an animal)
  …peatable,async            (set async mode)
  …peatable,exclusive       (disable options)
  …peatable,optional      (optional argument)
  …peatable,repeatable    (repeatable option)
  …peatable,special  (special chars: []'"$`\)
zsh_expected: |
  > crazy-complete-test -o repeatable,
  animal      -- select an animal
  async       -- set async mode
  exclusive   -- disable options
  optional    -- optional argument
  repeatable  -- repeatable option
  special     -- special chars: []'"$`\
