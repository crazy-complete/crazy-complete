number: 8
description: "key_value_list_exec: Check -o exclusive,"
send: "crazy-complete-test -o exclusive,"
bash_expected: |
  > crazy-complete-test -o exclusive,
  exclusive,optional    exclusive,repeatable  exclusive,special
  > crazy-complete-test -o exclusive,
fish_expected: |
  > crazy-complete-test -o exclusive,
  …xclusive,optional      (optional argument)
  …xclusive,repeatable    (repeatable option)
  …xclusive,special  (special chars: []'"$`\)
zsh_expected: |
  > crazy-complete-test -o exclusive,
  optional    -- optional argument
