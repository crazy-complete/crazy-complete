number: 5
description: "key_value_list: Check -o animal,"
send: "crazy-complete-test -o animal,"
bash_expected: |
  > crazy-complete-test -o animal,
  animal,async       animal,file        animal,number      animal,repeatable
  animal,exclusive   animal,nocomp      animal,proc        animal,with_sep
  > crazy-complete-test -o animal,
fish_expected: |
  > crazy-complete-test -o animal,
  animal,async               (set async mode)
  animal,exclusive  (deactivate some options)
  animal,file=
  animal,nocomp=               (no completer)
  animal,number=            (select a number)
  animal,proc=             (select a process)
  animal,repeatable       (repeatable option)
  animal,with_sep=    (values containing sep)
zsh_expected: |
  > crazy-complete-test -o animal,
  async       -- set async mode
  exclusive   -- deactivate some options
  nocomp      -- no completer
  number      -- select a number
  proc        -- select a process
  repeatable  -- repeatable option
  with_sep    -- values containing sep
  file
