args: ["--input-type=yaml", "--include-file=completers/key_value_list/include.$shell"]
definition_file: "definition.yaml"
---
number: 1
description: "key_value_list: Check -o"
send: "crazy-complete-test -o "
bash_expected: |
  > crazy-complete-test -o
  animal      exclusive   nocomp      proc        with_sep
  async       file        number      repeatable
  > crazy-complete-test -o
fish_expected: |
  > crazy-complete-test -o
  animal=           (select an animal)  number=          (select a number)
  async               (set async mode)  proc=           (select a process)
  exclusive  (deactivate some options)  repeatable     (repeatable option)
  file=                                 with_sep=  (values containing sep)
  nocomp=               (no completer)
zsh_expected: |
  > crazy-complete-test -o
  animal      -- select an animal
  async       -- set async mode
  exclusive   -- deactivate some options
  nocomp      -- no completer
  number      -- select a number
  proc        -- select a process
  repeatable  -- repeatable option
  with_sep    -- values containing sep
  file
---
number: 2
description: "key_value_list: Check -o a"
send: "crazy-complete-test -o a"
bash_expected: |
  > crazy-complete-test -o a
  animal  async
  > crazy-complete-test -o a
fish_expected: |
  > crazy-complete-test -o a
  animal=  (select an animal)  async  (set async mode)
zsh_expected: |
  > crazy-complete-test -o a
  animal  -- select an animal
  async   -- set async mode
