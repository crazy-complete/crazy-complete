args: ["--input-type=yaml", "--include-file=completers/key_value_pair/include.$shell"]
definition_file: "definition.yaml"
---
number: 1
description: "key_value_pair: Check -o"
send: "crazy-complete-test -o "
bash_expected: |
  > crazy-complete-test -o
  animal    async     file      nocomp    number    proc      with_sep
  > crazy-complete-test -o
fish_expected: |
  > crazy-complete-test -o
  animal=  (select an animal)  number=          (select a number)
  async      (set async mode)  proc=           (select a process)
  file=                        with_sep=  (values containing sep)
  nocomp=      (no completer)
zsh_expected: |
  > crazy-complete-test -o
  animal    -- select an animal
  async     -- set async mode
  nocomp    -- no completer
  number    -- select a number
  proc      -- select a process
  with_sep  -- values containing sep
  file
---
number: 2
description: "key_value_pair: Check -o a"
send: "crazy-complete-test -o a"
bash_expected: |
  > crazy-complete-test -o a
  animal  async
  > crazy-complete-test -o a
fish_expected: |
  > crazy-complete-test -o a
  animal=  (select an animal)  async  (set async mode)
zsh_expected: |
  > crazy-complete-test -o a
  animal  -- select an animal
  async   -- set async mode
---
number: 3
description: "key_value_pair: Check -o an"
send: "crazy-complete-test -o an"
bash_expected: |
  > crazy-complete-test -o animal
fish_expected: |
  > crazy-complete-test -o animal=
zsh_expected: |
  > crazy-complete-test -o animal=
---
number: 4
description: "key_value_pair: Check -o animal="
send: "crazy-complete-test -o animal="
bash_expected: |
  > crazy-complete-test -o animal=
  cat    dog    horse
  > crazy-complete-test -o animal=
fish_expected: |
  > crazy-complete-test -o animal=
  animal=cat  animal=dog  animal=horse
zsh_expected: |
  > crazy-complete-test -o animal=
  cat    dog    horse
---
number: 5
description: "key_value_pair: Check -o number="
send: "crazy-complete-test -o number="
bash_expected: |
  > crazy-complete-test -o number=
  0  1  2
  > crazy-complete-test -o number=
fish_expected: |
  > crazy-complete-test -o number=
  number=0  (zero)  number=1  (one)  number=2  (two)
zsh_expected: |
  > crazy-complete-test -o number=
  0  -- zero
  1  -- one
  2  -- two
---
number: 6
description: "key_value_pair: Check -o 'number="
send: "crazy-complete-test -o 'number="
bash_expected: |
  > crazy-complete-test -o 'number=
  number=0  number=1  number=2
  > crazy-complete-test -o 'number=
fish_expected: |
  > crazy-complete-test -o 'number=
  'number=0  (zero)  'number=1  (one)  'number=2  (two)
zsh_expected: |
  > crazy-complete-test -o 'number=
  0  -- zero
  1  -- one
  2  -- two
---
number: 7
description: "key_value_pair: Check -o \"number="
send: "crazy-complete-test -o \"number="
bash_expected: |
  > crazy-complete-test -o "number=
  number=0  number=1  number=2
  > crazy-complete-test -o "number=
fish_expected: |
  > crazy-complete-test -o "number=
  "number=0  (zero)  "number=1  (one)  "number=2  (two)
zsh_expected: |
