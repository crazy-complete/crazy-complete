  0  -- zero
  1  -- one
  2  -- two
---
number: 8
description: "key_value_pair: Check -o file=f"
send: "crazy-complete-test -o file=f"
bash_expected: |
  > crazy-complete-test -o file=f
  file with spaces  file1.TXT         file4.txt.1
  file0.txt         file3.tXt
  > crazy-complete-test -o file=file
fish_expected: |
  > crazy-complete-test -o file=file
  file=file with spaces  file=file1.TXT  file=file4.txt.1
  file=file0.txt         file=file3.tXt
zsh_expected: |
  > crazy-complete-test -o file=file
---
number: 9
description: "key_value_pair: Check -o with_sep=value="
comment: "Does not work for Bash yet"
send: "crazy-complete-test -o with_sep=value="
bash_expected: |
  > crazy-complete-test -o with_sep=value=value=foo
fish_expected: |
  > crazy-complete-test -o with_sep=value=foo
zsh_expected: |
  > crazy-complete-test -o with_sep=value=foo
---
number: 10
description: "key_value_pair: Check --condition "
send: "crazy-complete-test --condition "
bash_expected: |
  > crazy-complete-test --condition
  animal    async     file      nocomp    number    proc      with_sep
  > crazy-complete-test --condition
fish_expected: |
  > crazy-complete-test --condition
  animal=  (select an animal)  nocomp=             (no completer)
  async      (set async mode)  number=          (select a number)
  disabled  (disabled option)  proc=           (select a process)
  file=                        with_sep=  (values containing sep)
zsh_expected: |
  > crazy-complete-test --condition
  animal    -- select an animal
  async     -- set async mode
  nocomp    -- no completer
  number    -- select a number
  proc      -- select a process
  with_sep  -- values containing sep
  file
