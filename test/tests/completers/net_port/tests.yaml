args: ["--input-type=yaml"]
definition_file: "definition.yaml"
---
number: 1
description: "Check service (prefix 'k')"
send: "crazy-complete-test --service k"
bash_expected: |
  > crazy-complete-test --service k
  kamanda          kerberos-master  klogin           kshell
  kerberos         kerberos4        kpasswd
  kerberos-adm     kermit           krb-prop
  > crazy-complete-test --service k
fish_expected: |
  > crazy-complete-test --service k
  kamanda  (10081 - amanda backup services (Kerberos))
  kerberos                          (88 - Kerberos v5)
  kerberos4                  (750 - Kerberos (server))
  kerberos-adm          (749 - Kerberos 'kadmin' (v5))
  kerberos-master      (751 - Kerberos authentication)
  kermit
  klogin              (543 - Kerberized 'rlogin' (v5))
  kpasswd
  krb-prop          (754 - Kerberos slave propagation)
  kshell                 (544 - Kerberized 'rsh' (v5))
zsh_expected: |
  > crazy-complete-test --service k
  kamanda          -- 10081 - amanda backup services (Kerberos)
  kerberos         -- 88 - Kerberos v5
  kerberos-adm     -- 749 - Kerberos 'kadmin' (v5)
  kerberos-master  -- 751 - Kerberos authentication
  kerberos4        -- 750 - Kerberos (server)
  klogin           -- 543 - Kerberized 'rlogin' (v5)
  krb-prop         -- 754 - Kerberos slave propagation
  kshell           -- 544 - Kerberized 'rsh' (v5)
  kermit   kpasswd
---
