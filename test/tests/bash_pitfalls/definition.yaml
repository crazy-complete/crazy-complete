prog: "crazy-complete-test"
options:

  # ===========================================================================
  # choices
  # ===========================================================================

  - option_strings: ["--ch-space"]
    complete: ["choices", ["one two", "three four", "plain"]]

  - option_strings: ["--ch-glob"]
    complete: ["choices", ["a*foo", "bar?", "baz1"]]

  - option_strings: ["--ch-colon"]
    complete: ["choices", ["a:b", "c:d:e", "plain"]]

  - option_strings: ["--ch-semicolon"]
    complete: ["choices", ["semi;colon", "plain"]]

  - option_strings: ["--ch-at"]
    complete: ["choices", ["a@b", "plain"]]

  - option_strings: ["--ch-quote"]
    complete: ["choices", ["with'quote'", "with\"double\"", "plain"]]

  - option_strings: ["--ch-dollar"]
    complete: ["choices", ["dollar$x", "plain"]]

  - option_strings: ["--ch-backtick"]
    complete: ["choices", ["back`tick`", "plain"]]

  - option_strings: ["--ch-paren"]
    complete: ["choices", ["paren(x)", "plain"]]

  - option_strings: ["--ch-slashdot"]
    complete: ["choices", ["/abs/path", ".rel", "..", "plain"]]

  - option_strings: ["--ch-tilde"]
    complete: ["choices", ["~/x", "~/", "plain"]]

  - option_strings: ["--ch-combo"]
    complete: ["choices", ["a b'c\"d*e?f", "plain"]]

  # ===========================================================================
  # list
  # ===========================================================================

  - option_strings: ["--list-comma"]
    complete: ["list", ["choices", ["one", "two", "three"]]]

  - option_strings: ["--list-colon"]
    complete: ["list", ["choices", ["one", "two", "three"]], {"separator": ":"}]

  - option_strings: ["--list-eq"]
    complete: ["list", ["choices", ["one", "two", "three"]], {"separator": "="}]

  - option_strings: ["--list-dot"]
    complete: ["list", ["choices", ["one", "two", "three"]], {"separator": "."}]

  - option_strings: ["--list-semi"]
    complete: ["list", ["choices", ["one", "two", "three"]], {"separator": ";"}]

  - option_strings: ["--list-space"]
    complete: ["list", ["choices", ["one two", "three four"]], {"separator": ","}]

  - option_strings: ["--list-sepinvalue"]
    complete: ["list", ["choices", ["a,b", "c"]], {"separator": ","}]

  - option_strings: ["--list-colonspace"]
    complete: ["list", ["choices", ["one two", "three"]], {"separator": ":"}]

  - option_strings: ["--list-dup"]
    complete: ["list", ["choices", ["one", "two"]], {"separator": ":", "duplicates": true}]

  # ===========================================================================
  # key_value_list
  # ===========================================================================

  - option_strings: ["--kvl-comma-eq"]
    complete: ["key_value_list", ",", "=", [
      ["alpha", "desc", ["choices", ["one two", "three four"]]],
      ["beta",   null,  ["choices", ["a:b", "c;d"]]],
      ["gamma",  null,  ["choices", ["a,b", "plain"]]]
    ]]

  - option_strings: ["--kvl-comma-colon"]
    complete: ["key_value_list", ",", ":", [
      ["alpha", "desc", ["choices", ["one two", "three four"]]],
      ["beta",   null,  ["choices", ["a:b", "c;d"]]]
    ]]

  - option_strings: ["--kvl-colon-eq"]
    complete: ["key_value_list", ":", "=", [
      ["alpha", "desc", ["choices", ["one", "two"]]],
     ["beta",    null,  ["choices", ["a:b", "c;d"]]]
    ]]

  - option_strings: ["--kvl-semi-eq"]
    complete: ["key_value_list", ";", "=", [
      ["alpha", "desc", ["choices", ["one", "two"]]],
      ["beta",   null,  ["choices", ["a;b", "c"]]]
    ]]

  - option_strings: ["--kvl-glob"]
    complete: ["key_value_list", ",", "=", [
      ["glob", "desc", ["choices", ["a*b", "c[d]"]]]
    ]]

  - option_strings: ["--kvl-quote"]
    complete: ["key_value_list", ",", "=", [
      ["quote", "desc", ["choices", ["x'y", "z\"w", "plain"]]]
    ]]

  # ===========================================================================
  # key_value_pair
  # ===========================================================================

  - option_strings: ["--kvp-eq"]
    complete: ["key_value_pair", "=", [
      ["k1", "desc", ["choices", ["one two", "three four"]]],
      ["k2",  null,  ["choices", ["a:b", "c;d"]]],
      ["k3",  null,  ["choices", ["a*b", "baz1"]]]
    ]]

  - option_strings: ["--kvp-colon"]
    complete: ["key_value_pair", ":", [
      ["k1", "desc", ["choices", ["one two", "three four"]]],
      ["k2",  null,  ["choices", ["a:b", "c;d"]]]
    ]]

  - option_strings: ["--kvp-semi"]
    complete: ["key_value_pair", ";", [
      ["k1", "desc", ["choices", ["a;b", "c"]]]
    ]]

  - option_strings: ["--kvp-glob"]
    complete: ["key_value_pair", "=", [
      ["kg", "desc", ["choices", ["a*b", "?x"]]]
    ]]

  # ===========================================================================
  # combinations
  # ===========================================================================

  - option_strings: ["--list-of-kvp"]
    complete: ["list", ["key_value_pair", "=", [
      ["pair", "desc", ["choices", ["one", "two"]]]
    ]]]

positionals:
  - number: 1
    complete: ["choices", ["one two", "a:b", "c*d", "--long", "plain"]]
